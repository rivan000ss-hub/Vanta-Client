name: Build VANTA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VANTA_Launcher_0_2/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        working-directory: VANTA_Launcher_0_2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Locate Tcl and Tk libraries
        shell: pwsh
        run: |
          $tclRoot = Join-Path $env:pythonLocation "tcl"
          $tclDir = Get-ChildItem -Path $tclRoot -Directory -Filter "tcl*" |
            Where-Object { Test-Path (Join-Path $_.FullName "init.tcl") } |
            Select-Object -First 1
          $tkDir = Get-ChildItem -Path $tclRoot -Directory -Filter "tk*" |
            Where-Object { Test-Path (Join-Path $_.FullName "tk.tcl") } |
            Select-Object -First 1

          if (-not $tclDir) { throw "Tcl init.tcl was not found under $tclRoot" }
          if (-not $tkDir) { throw "Tk tk.tcl was not found under $tclRoot" }

          "VANTA_TCL_DIR=$($tclDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VANTA_TK_DIR=$($tkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tcl library: $($tclDir.FullName)"
          Write-Host "Tk library: $($tkDir.FullName)"

      - name: Compile-check Python source
        working-directory: VANTA_Launcher_0_2
        run: python -m py_compile vanta_launcher.py

      - name: Build onedir Windows package
        working-directory: VANTA_Launcher_0_2
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onedir --windowed --name VANTA-Launcher --add-data "$env:VANTA_TCL_DIR;_tcl_data" --add-data "$env:VANTA_TK_DIR;_tk_data" vanta_launcher.py

      - name: Smoke-test bundled Tcl/Tk and GUI
        working-directory: VANTA_Launcher_0_2
        shell: pwsh
        run: |
          $exe = ".\dist\VANTA-Launcher\VANTA-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "Built EXE not found: $exe" }

          $testProcess = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) {
            throw "VANTA Tcl/Tk GUI self-test failed with exit code $($testProcess.ExitCode)"
          }
          Write-Host "VANTA bundled Tcl/Tk and GUI self-test passed."

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-Windows
          path: VANTA_Launcher_0_2/dist/VANTA-Launcher/
          if-no-files-found: error
          retention-days: 14
