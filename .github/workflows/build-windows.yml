name: Build VANTA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VANTA_Launcher_0_2/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: VANTA_Launcher_0_2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check source
        working-directory: VANTA_Launcher_0_2
        run: python -m py_compile vanta_launcher_qt.py

      - name: Build Qt Windows application
        working-directory: VANTA_Launcher_0_2
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name VANTA-Launcher --collect-all PySide6 vanta_launcher_qt.py

      - name: Verify executable exists
        working-directory: VANTA_Launcher_0_2
        shell: pwsh
        run: |
          $exe = ".\dist\VANTA-Launcher\VANTA-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "Built EXE not found: $exe" }
          Write-Host "VANTA Qt executable was created."

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-Windows
          path: VANTA_Launcher_0_2/dist/VANTA-Launcher/
          if-no-files-found: error
          retention-days: 14
