name: Build VANTA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VANTA_Launcher_0_2/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        working-directory: VANTA_Launcher_0_2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build EXE
        working-directory: VANTA_Launcher_0_2
        run: pyinstaller --noconfirm --clean --onefile --windowed --name VANTA-Launcher vanta_launcher.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-Windows
          path: VANTA_Launcher_0_2/dist/VANTA-Launcher.exe
          if-no-files-found: error
          retention-days: 14
